name: Dependency Security Scan

on:
  schedule:
    - cron: '0 8 * * 1'  # Every Monday at 8:00 UTC
  push:
    branches: [main]
    paths:
      - 'scustack-api/pyproject.toml'
      - 'scustack-api/requirements*.txt'
      - 'scustack-web/package.json'
      - 'scustack-web/package-lock.json'
  pull_request:
    paths:
      - 'scustack-api/pyproject.toml'
      - 'scustack-api/requirements*.txt'
      - 'scustack-web/package.json'
      - 'scustack-web/package-lock.json'

jobs:
  pip-audit:
    name: Python Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit Python dependencies
        working-directory: scustack-api
        run: |
          if [ -f requirements.txt ]; then
            pip-audit -r requirements.txt --ignore-vuln PYSEC-2024-* || true
          elif [ -f pyproject.toml ]; then
            pip-audit --ignore-vuln PYSEC-2024-* || true
          fi

  npm-audit:
    name: npm Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Audit JS dependencies
        working-directory: scustack-web
        run: |
          npm audit --audit-level=high || true
