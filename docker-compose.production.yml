name: scustack

services:
  postgres:
    image: postgres:16.8-alpine
    ports: !reset []
    environment:
      POSTGRES_USER: scustack
      POSTGRES_PASSWORD: ${SCUSTACK_DB_PASSWORD:?SCUSTACK_DB_PASSWORD is required}
      POSTGRES_DB: scustack
    networks: [backend]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 512M

  redis:
    image: redis:7.4.2-alpine
    ports: !reset []
    networks: [backend]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  elasticsearch:
    image: ghcr.io/scustack/scustack-elasticsearch:${SCUSTACK_RELEASE_SHA:?SCUSTACK_RELEASE_SHA is required}
    profiles: !reset []
    ports: !reset []
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - 'ES_JAVA_OPTS=-Xms512m -Xmx512m'
      - bootstrap.memory_lock=false
    ulimits: !reset {}
    networks: [backend]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 1G

  onlyoffice:
    profiles: ['development']
    ports: !reset []

  api:
    image: ghcr.io/scustack/scustack-api:${SCUSTACK_RELEASE_SHA:?SCUSTACK_RELEASE_SHA is required}
    env_file: ${SCUSTACK_ENV_FILE:-/srv/apps/scustack/shared/.env}
    tmpfs:
      - /dev/shm:rw,noexec,nosuid,size=16m
      - /tmp/scustack-scu-cli:rw,noexec,nosuid,size=16m,mode=0700
    volumes:
      - thumbnail_data:/app/data/thumbnails
      - preview_cache_data:/app/data/previews
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks: [backend, egress]
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 384M

  web:
    image: ghcr.io/scustack/scustack-web:${SCUSTACK_RELEASE_SHA:?SCUSTACK_RELEASE_SHA is required}
    env_file: ${SCUSTACK_ENV_FILE:-/srv/apps/scustack/shared/.env}
    networks: [frontend]
    restart: unless-stopped
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  worker:
    image: ghcr.io/scustack/scustack-api:${SCUSTACK_RELEASE_SHA:?SCUSTACK_RELEASE_SHA is required}
    env_file: ${SCUSTACK_ENV_FILE:-/srv/apps/scustack/shared/.env}
    command: celery -A app.core.celery_app worker -l info -Q default,scan,thumbnail --concurrency=1
    tmpfs:
      - /tmp/scustack-scu-cli:rw,noexec,nosuid,size=16m,mode=0700
    volumes:
      - thumbnail_data:/app/data/thumbnails
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks: [backend, egress]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  beat:
    image: ghcr.io/scustack/scustack-api:${SCUSTACK_RELEASE_SHA:?SCUSTACK_RELEASE_SHA is required}
    env_file: ${SCUSTACK_ENV_FILE:-/srv/apps/scustack/shared/.env}
    command: celery -A app.core.celery_app beat -l info
    depends_on:
      redis:
        condition: service_healthy
    networks: [backend]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 192M

  ingress:
    image: nginx:1.27.5-alpine
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
      - 127.0.0.1:${SCUSTACK_INGRESS_PORT:-8080}:80
    volumes:
      - ./docker/nginx/scustack.conf:/etc/nginx/nginx.conf:ro
    networks: [frontend, backend]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

networks:
  frontend:
  egress:
  backend:
    internal: true

volumes:
  thumbnail_data:
  preview_cache_data:
