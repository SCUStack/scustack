events {}

http {
  proxy_cache_path /var/cache/nginx/thumbnails
    levels=1:2
    keys_zone=thumbnail_cache:32m
    max_size=512m
    inactive=30d
    use_temp_path=off;

  map "$http_authorization:$http_cookie" $thumbnail_cache_bypass {
    default 1;
    ":" 0;
  }

  server {
    listen 80;
    server_name _;
    client_max_body_size 55m;

    location ~ "^/api/v1/materials/[0-9a-fA-F-]{36}/thumbnail$" {
      proxy_pass http://api:8000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache thumbnail_cache;
      proxy_cache_bypass $thumbnail_cache_bypass;
      proxy_no_cache $thumbnail_cache_bypass;
      proxy_cache_lock on;
      proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
      proxy_cache_background_update on;
      proxy_cache_valid 200 30d;
      add_header X-Thumbnail-Cache $upstream_cache_status always;
    }

    location /api/ {
      proxy_pass http://api:8000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      proxy_pass http://web:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
